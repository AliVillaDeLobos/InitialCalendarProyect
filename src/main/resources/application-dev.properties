spring.application.name=proyecto_final

#Data Base
spring.datasource.url=jdbc:postgresql://ep-patient-art-aqp5z0nx-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=${DEV_DB_USER}
spring.datasource.password=${DEV_DB_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform= org.hibernate.dialect.PostgreSQLDialect

