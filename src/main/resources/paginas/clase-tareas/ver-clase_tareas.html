
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">
    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>

    <div class="container text-center mt-3">
        <div class="row">
            <div class="col-auto">
                <form class="row g-1" th:action="@{/auth/clase-tareas/recibir-nombre}" method="post">
                    <label for="nombre">Ingresa el nombre para buscar</label>
                    <div class="mb-3 d-flex align-items-center">
                        <input type="text" class="form-control" id="nombre"
                               name="nombre"
                               th:value="${nombre}"
                               placeholder="Ingresa el nombre de la clase tarea" required>
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <div class="col align-self-end">
        <a class="btn btn-primary" th:href="@{/auth/clase-tareas/ver-lista-clase_tareas}" role="button">Ver todas</a>
    </div>
    <br>
    <table th:if="${!claseTareas.isEmpty()}" class="table table-striped table-hover table-sm">
        <thead class="table-dark table-bordered">
        <tr>
            <th scope="col"> Nombre </th>
            <th scope="col"> Color </th>
            <th scope="col"> Más opciones </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ct: ${claseTareas}">
            <td th:text="${ct.nombre}"></td>
            <td>
                <span th:style="'display:inline-block; width:15px; height:15px; border-radius:50%; background-color:' + ${ct.color.codigo}" ></span>
            </td>
            <td>
                <a th:href="@{/auth/clase-tareas/modificar-clase_tarea/{id}(id=${ct.idClaseTarea})}"
                   class="btn btn-success">Modificar <i class="fas fa-pen-nib"
                                                        aria-hidden="true"></i> </a>
                <a th:href="@{/auth/clase-tareas/eliminar-clase_tarea/{id}(id=${ct.idClaseTarea})}"
                   class="btn btn-danger">Eliminar <i class="fas fa-trash-alt"
                                                      aria-hidden="true"></i> </a>

            </td>
        </tr>
        </tbody>
    </table>
    <nav th:replace="~{plantillas/pag-nav::paginador}"></nav>
</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
