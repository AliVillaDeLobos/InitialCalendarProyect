
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">
    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>


    <div class="col align-self-end">
        <a class="btn btn-primary" th:href="@{/admin/usuario/ver-subtareas-eliminadas}" role="button">Ver todas</a>
    </div>
    <br>
    <table th:if="${!subtareas.isEmpty()}" class="table table-striped table-hover table-sm">
        <thead class="table-dark table-bordered">
        <tr>
            <th scope="col"> Nombre </th>
            <th scope="col"> Completada </th>
            <th scope="col"> Tarea </th>
            <th scope="col"> Fecha de eliminación </th>
            <th scope="col"> Motivo y rol </th>
            <th scope="col"> Más opciones </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s: ${subtareas}">
            <td th:text="${s.nombre}"></td>
            <td th:text="${s.estado}"></td>
            <td th:text="${s.nombreTarea}"></td>
            <td th:text="${s.fechaEliminacion}"></td>
            <td th:text="${s.mensaje}"></td>

            <td>
                <button type="button"
                        class="btn btn-success btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#restaurarModal"
                        th:attr="data-id=${s.idSubtareaEliminada},
                        data-nombre=${s.nombre}">
                    Restaurar
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="modal fade" id="restaurarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form th:action="@{/admin/usuario/restaurar-eliminada}" method="post">
                <input type="hidden" name="idSubtareaEliminada" id="modalIdSubtarea" />
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Restaurar Subtarea</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>¿Estás seguro de que deseas restaurar la subtarea: <strong id="modalNombre"></strong>?</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Restaurar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const restaurarModal = document.getElementById('restaurarModal');
        restaurarModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const idSubtarea = button.getAttribute('data-id');
            const nombre = button.getAttribute('data-nombre');

            document.getElementById('modalIdSubtarea').value = idSubtarea;
            document.getElementById('modalNombre').textContent = nombre;
        });
    </script>

</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
