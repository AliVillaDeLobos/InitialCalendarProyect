<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">
    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>

    <div class="card-body ">
            <form th:action="@{/admin/usuario/modificar-usuario/{idUsuario}(idUsuario=${usuario.idUsuario})}"
                  method="post" th:object="${usuario}">
                <div class="container-fluid">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre(s)</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('nombre')} ? 'form-control is-invalid':'form-control'"
                                   th:field="*{nombre}"
                                   placeholder="Escribe tu nombre" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Primer apellido</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('apellidoPaterno')} ? 'form-control is-invalid':'form-control'"
                                   th:field="*{apellidoPaterno}"
                                   placeholder="Primer apellido" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Segundo apellido</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('apellidoMaterno')} ? 'form-control is-invalid':'form-control'"
                                   th:field="*{apellidoMaterno}"
                                   placeholder="Segundo apellido" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email"
                                   th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid':'form-control'"
                                   th:field="*{email}"
                                   placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contraseña Actual
                                <span class="text-muted small">*Es obligatoria para actualizar los datos*</span></label>
                            <input type="password"
                                   th:class="${#fields.hasErrors('usuarioPassword')} ? 'form-control is-invalid':'form-control'"
                                   th:field="*{usuarioPassword}"
                                   placeholder="********" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contraseña Nueva
                                <span class="text-muted small">*No es obligatorio, solo para cambiar*</span> </label>
                            <input type="password"
                                   class="form-control"
                                   name="nuevaPassword"
                                   placeholder="********">
                        </div>
                    </div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="bi bi-check2-circle"></i> Actualizar
                    </button>
                    <a th:href="@{/auth/inicio}" class="btn btn-dark mt-2">
                        <i class="bi bi-arrow-left-circle"></i> Regresar
                    </a>
                </div>
            </form>
    </div>
</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
