<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}">
</head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">
    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>

    <div class="card p-4 mx-auto" style="max-width: 600px;">
        <form th:action="@{/auth/dias-horas/guardar}" method="post" class="mt-4">
            <input type="hidden" name="idSubtarea" th:value="${idSubtarea}"/>

            <div class="mb-4 text-start">
                <label for="idDia" class="form-label fw-bold">Selecciona un día:</label>
                <select class="form-select" id="idDia" name="idDia" required onchange="cargarHorasDisponibles(this.value)">
                    <option value="" disabled selected>-- Selecciona un día --</option>
                    <option th:each="d : ${dias}"
                            th:value="${d.id}"
                            th:text="${#strings.capitalize(d.nombreDia.name().toLowerCase())}">
                    </option>
                </select>
            </div>
            <div id="horasContainer" class="text-start mt-3" style="display:none;">
                <label class="form-label fw-bold">Horas disponibles:</label>
                <div id="listaHoras" class="row row-cols-2 row-cols-md-4 g-2">
                </div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Guardar</button>
                <a th:href="@{/auth/dias-horas/ver-lista}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>


    </div>


</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    async function cargarHorasDisponibles(idDia) {
        if (!idDia) return;

        try {
            const response = await axios.get(`/auth/dias-horas/horas-libres/${idDia}`);
            const horas = response.data;

            const container = document.getElementById('listaHoras');
            container.innerHTML = ''; // limpia los resultados previos
            document.getElementById('horasContainer').style.display = 'block';

            if (horas.length === 0) {
                container.innerHTML = `<p class='text-muted'>No hay horas disponibles para este día.</p>`;
                return;
            }

            horas.forEach(h => {
                const div = document.createElement('div');
                div.classList.add('col');
                div.innerHTML = `
                    <div class="form-check border rounded p-2 bg-light">
                        <input class="form-check-input" type="checkbox" name="horasSeleccionadas" id="hora_${h}" value="${h}">
                        <label class="form-check-label" for="hora_${h}">${h}:00 hrs</label>
                    </div>
                `;
                container.appendChild(div);
            });
        } catch (error) {
            console.error('Error al cargar las horas:', error);
            alert('Ocurrió un error al obtener las horas disponibles.');
        }
    }
</script>

</body>
</html>
