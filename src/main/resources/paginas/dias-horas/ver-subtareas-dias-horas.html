
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">
    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>

    <div class="container text-center mt-3">
        <!--<div class="row">
            <div class="col-auto">
                <form class="row g-1" th:action="@{/auth/dias-horas/buscar}" method="post">
                    <label for="nombre">Ingresa el nombre de la subtarea para buscar</label>
                    <div class="mb-3 d-flex align-items-center">
                        <input type="text" class="form-control" id="nombre"
                               name="nombre"
                               th:value="${nombre}"
                               placeholder="Ingresa el nombre de la subtarea" required>
                        <button type="submit" class="btn btn-primary ms-2">Buscar</button>
                    </div>
                </form>
            </div>
        </div>-->

        <div class="col align-self-end">
            <a class="btn btn-primary" th:href="@{/auth/dias-horas/ver-lista}" role="button">Ver todas</a>
        </div>

        <br>

        <table th:if="${!diasSubtarea.isEmpty()}" class="table table-striped table-hover table-sm">
            <thead class="table-dark table-bordered">
            <tr>
                <th scope="col">Nombre Subtarea</th>
                <th scope="col">Día</th>
                <th scope="col">Horas</th>
                <th scope="col">Estado</th>
                <th scope="col">Num. Semana</th>
                <th scope="col">Fecha Semana</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="ds : ${diasSubtarea}">
                <td th:text="${ds.nombreSubtarea}"></td>
                <td th:text="${ds.nombreDia.toLowerCase()}"></td>
                <td>
<!--                    <span th:text="${#lists.join(ds.horas, ', ')} + ' hrs'"></span>-->
                    <span th:each="h : ${ds.horas}" th:text="${h} + ':00 '"></span>hrs
                </td>
                <td th:text="${ds.estado.name().toLowerCase()}"></td>
                <td th:text="${ds.numeroSemana}"></td>
                <td th:text="${ds.fechaInicioSemana}+'- a -'+ ${ds.fechaFinSemana}"></td>
                <td>

                    <form th:action="@{/auth/dias-horas/eliminar-dia/{idSubtarea}/{nombreDia}(idSubtarea=${ds.idSubtarea}, nombreDia=${ds.nombreDia})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Eliminar Día
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${diasSubtarea.isEmpty()}" class="alert alert-info" role="alert">
            No hay subtareas registradas con días y horas asignadas.
        </div>
    </div>
  <!--  <nav th:replace="~{plantillas/pag-nav::paginador}"></nav>-->

</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
