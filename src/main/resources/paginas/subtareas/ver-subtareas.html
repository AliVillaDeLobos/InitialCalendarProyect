
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">
    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>

    <div class="container text-center mt-3">
        <div class="row">
            <div class="col-auto">
                <form class="row g-1" th:action="@{/auth/subtareas/recibir-nombre}" method="post">
                    <label for="nombre">Ingresa el nombre para buscar</label>
                    <div class="mb-3 d-flex align-items-center">
                        <input type="text" class="form-control" id="nombre"
                               name="nombre"
                               th:value="${nombre}"
                               placeholder="Ingresa el nombre de la subtarea" required>
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <div class="col align-self-end">
        <a class="btn btn-primary" th:href="@{/auth/subtareas/ver-lista-subtareas}" role="button">Ver todas</a>
        <a class="btn btn-dark" th:href="@{/auth/dias-horas/ver-lista}"  role="button">Ver lista de días y horas</a>
    </div>
    <br>
    <table th:if="${!subtareas.isEmpty()}" class="table table-striped table-hover table-sm">
        <thead class="table-dark table-bordered">
        <tr>
            <th scope="col"> Nombre </th>
            <th scope="col"> Completada </th>
            <th scope="col"> Tarea </th>
            <th scope="col"> Fecha de creación </th>
            <th scope="col"> Eliminada </th>
            <th scope="col"> Más opciones </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s: ${subtareas}">
            <td th:text="${s.nombre}"></td>
            <td th:text="${s.estado}"></td>
            <td th:text="${s.nombreTarea}"></td><!--th:style="'background-color:' + ${s.codigoColor} + '; color: white;'-->
            <td th:text="${s.fechaCreacion}"></td>
            <td th:text="${s.eliminada}"></td>

            <td>
                <a th:href="@{/auth/subtareas/modificar-subtarea/{id}(id=${s.idSubtarea})}"
                   class="btn btn-success">Modificar <i class="fas fa-pen-nib"
                                                        aria-hidden="true"></i> </a>
                <a th:href="@{/auth/dias-horas/agregar-dias-horas/{id}(id=${s.idSubtarea})}"
                   class="btn btn-success">Agregar Dia y Hora <i class="fas fa-pen-nib"
                                                        aria-hidden="true"></i> </a>
                <a th:href="@{/auth/subtareas/cambiar-estado-subtarea/{id}(id=${s.idSubtarea})}"
                   class="btn btn-warning">Cambiar estado <i class="fas fa-pen-nib"
                                                      aria-hidden="true"></i></a>
                <!--<a th:href="@{/auth/subtareas/eliminar-subtarea/{id}(id=${s.idSubtarea})}"
                   class="btn btn-danger">Eliminar <i class="fas fa-trash-alt"
                                                      aria-hidden="true"></i> </a>-->
                <a href="#"
                   class="btn btn-danger"
                   data-bs-toggle="modal"
                   data-bs-target="#eliminarModal"
                   th:attr="data-id=${s.idSubtarea}">
                    Eliminar <i class="fas fa-trash-alt"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <nav th:replace="~{plantillas/pag-nav::paginador}"></nav>

    <!-- Modal Para elimina subatrea-->
    <div class="modal fade" id="eliminarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form th:action="@{/auth/subtareas/eliminar-subtarea}" method="post">
                <input type="hidden" name="idSubtarea" id="modalIdSubtarea"/>
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Eliminar Subtarea</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label for="mensaje">Motivo de eliminación:</label>
                        <textarea name="mensaje" id="mensaje" class="form-control" required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const eliminarModal = document.getElementById('eliminarModal');
        eliminarModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget; // Botón que abrió el modal
            const idSubtarea = button.getAttribute('data-id');
            document.getElementById('modalIdSubtarea').value = idSubtarea;
        });
    </script>
</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
