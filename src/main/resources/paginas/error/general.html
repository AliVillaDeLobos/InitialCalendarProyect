<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}">
    <title>Error</title>
</head> <body>
<header th:replace="~{plantillas/plantilla :: header}">

</header>
<main class="container mt-5 bg-color-titulo">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 th:text="'Ocurrió un error (' + ${status} + ')'">Error</h4>
        </div>
        <div class="card-body">
            <h5 class="card-title text-danger" th:text="${error}">Error genérico</h5>
            <p class="card-text" th:text="${mensaje}">Mensaje de error</p>
            <!-- Si hay errores de validación, se listan aquí -->
            <ul class="list-group mb-3" th:if="${fields != null}">
                <li class="list-group-item" th:each="entry : ${fields}">
                    <strong th:text="${entry.key}"></strong>:
                    <span th:text="${entry.value}"></span>
                </li>
            </ul>
            <p class="text-muted" th:text="'Fecha y hora: ' + ${timestamp}">Fecha y hora</p>
            <div class="d-flex justify-content-end">
                <a th:href="@{/auth/inicio}" class="btn btn-outline-primary">Volver al inicio</a>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
