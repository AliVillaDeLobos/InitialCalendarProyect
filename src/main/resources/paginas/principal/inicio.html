<script th:inline="javascript">
    /*<![CDATA[*/
    window.subtareas = /*[[${diasSubtareas}]]*/ [];
    window.subtareasFormateadas = [];

    // Días sin tildes
    const diasSemana = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];

    function quitarTildes(str) {
        return str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";
    }

    // Convertir DTOs del backend a objetos JS que usaremos en el calendario
    window.subtareas.forEach(function(dto) {
        // dto.nombreDia viene como "MARTES" o "MIERCOLES"
        const nombreDiaNormalized = quitarTildes(dto.nombreDia.toLowerCase());
        const diaIndex = diasSemana.indexOf(nombreDiaNormalized);

        if (diaIndex !== -1 && dto.horas) {
            dto.horas.forEach(function(h) {
                window.subtareasFormateadas.push({
                    idSubtarea: dto.idSubtarea,                   // importante: id para seleccionar
                    // opcional: idTarea si lo incluyes en el DTO para agrupar por tarea
                    idTarea: dto.idTarea || null,
                    nombreSubtarea: dto.nombreSubtarea,
                    dia: diaIndex,
                    hora: h,
                    estado: dto.estado,
                    colorClase: dto.colorClase || '#007bff',
                    descripcion: dto.descripcion || ''           // opcional si lo tienes en DTO
                });
            });
        }
    });

    console.log('subtareasFormateadas ->', window.subtareasFormateadas);
    /*]]>*/

    function mostrarDetallesSubtarea(idSubtarea) {
        const subtarea = (window.subtareasFormateadas || []).find(s => s.idSubtarea === idSubtarea);
        if (!subtarea) return;

        // Actualizar panel lateral (IDs que tienes en tu HTML)
        const nombreEl = document.getElementById('subtarea-nombre');
        const descEl = document.getElementById('subtarea-descripcion');
        const estadoEl = document.getElementById('subtarea-estado');
        const listaRel = document.getElementById('lista-subtareas');

        if (nombreEl) nombreEl.textContent = subtarea.nombreSubtarea;
        if (descEl)  descEl.textContent = subtarea.descripcion || 'Sin descripción';
        if (estadoEl) estadoEl.textContent = subtarea.estado || '';

        // listar relacionadas por idTarea (necesitas idTarea en DTO para esto)
        if (listaRel) {
            listaRel.innerHTML = '';
            if (subtarea.idTarea) {
                const relacionadas = (window.subtareasFormateadas || []).filter(s => s.idTarea === subtarea.idTarea);
                relacionadas.forEach(r => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    li.textContent = `${r.nombreSubtarea} (${r.hora}:00)`;
                    listaRel.appendChild(li);
                });
            } else {
                // Si no tienes idTarea, simplemente muestro la propia
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.textContent = `${subtarea.nombreSubtarea} (${subtarea.hora}:00)`;
                listaRel.appendChild(li);
            }
        }


    }
</script>
