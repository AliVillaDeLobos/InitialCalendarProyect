<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-color-titulo rounded">

    <h1 class="display-4" th:text="${titulo}"></h1>
    <h3 th:text="${contenido}"></h3>

    <div class="container text-center">
        <div class="row">
            <div class="col-auto">
                <form class="row g-1" th:action="@{/auth/tareas/recibir-color}" method="post">
                    <label for="color">Color de la tarea</label>
                    <div class="mb-3 d-flex align-items-center">
                        <input type="text" class="form-control" id="color"
                               name="color"
                               th:value="${color}"
                               placeholder="Ingresa el nombre de la tarea" required>
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col align-self-end">
        <a class="btn btn-primary" th:href="@{/auth/tareas/ver-lista-tareas}" role="button">Ver todas</a>
    </div> <br>

    <table th:if="${!tareas.isEmpty()}" class="table table-striped table-hover table-sm">
        <thead class="table-dark table-bordered">
        <tr>
            <th scope="col"> Nombre </th>
            <th scope="col"> Clase Tarea </th>
            <th scope="col"> Más opciones </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t: ${tareas}">
            <td th:text="${t.nombre}"></td>
            <td th:text="${t.claseTarea.nombre}"></td>
            <td>
                <a th:href="@{/auth/tareas/modificar-tarea/{id}(id=${t.idTarea})}"
                        class="btn btn-success">Modificar <i class="fas fa-pen-nib"
                                                             aria-hidden="true"></i> </a>
                <a th:href="@{/auth/tareas/eliminar-tarea/{id}(id=${t.idTarea})}"
                        class="btn btn-danger">Eliminar <i class="fas fa-trash-alt"
                                                           aria-hidden="true"></i> </a>

            </td>
        </tr>
        </tbody>
    </table>

    <nav th:replace="~{plantillas/pag-nav::paginador}"></nav>

</main>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
